# "Passport" of the package: name, version, what it needs and how to start it.
# Install from this folder:   pip install .
# Build a file to carry over: pip wheel . --no-deps -w dist

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rfn-mon-viewer"
version = "0.1.0"
description = "Монитор ВЧ2: мониторинг 8 резонаторов через Tango (только чтение)"
readme = "README.md"
# pytango 9.3.4 has Windows builds only for old Python, the lab uses 3.8
requires-python = ">=3.8, <3.9"
dependencies = [
    "pytango==9.3.4",
    "PyQt5",
    "pyqtgraph",
    "numpy<1.24",
]

# pip creates Scripts\rfn-mon-viewer.exe that starts the window without a console
[project.gui-scripts]
rfn-mon-viewer = "rfn_app.oapp.mon.launcher:main"

[tool.setuptools.packages.find]
include = ["rfn_app*"]

# the default config goes into the package together with the code
[tool.setuptools.package-data]
"rfn_app.oapp.mon" = ["RfnMonViewer-config.json"]
